/* ── shapes ───────────────────────────────────────────────────────────────── */

/** Points round an ellipse; o.rot turns it, o.a0..o.a1 draw an arc. Clockwise on screen. */

/** A smooth curve through points (centripetal Catmull-Rom). o.closed loops it. */

/* ── the pen ──────────────────────────────────────────────────────────────── */

/**

 *   t        with BOIL (or o.boil per second), re-keys on that step

 *   taper    [start, end] px over which the line thins to a fifth (w*3 each)
 *   press    0..1 slow swell and thinning along the line (.38)

/** ink() closed round a shape. */
const outline = (g, pts, o = {}) => ink(g, pts, { ...o, closed: true });

/**

 *   key, t     as ink()

/** Where lines at angle `ang` cross a closed shape: inside spans along each line, ordered. */

/**

 * way a hand does, short of it or a little past, never on a ruled clip.
 *   key, t     as ink()
 *   gap        px between strokes (9)   ang  radians (-.6)   w  nib (1.8)
 *   cross      adds a second pass at ang + .9

 *   ragged     px the ends wander off the edge (5)

  // Row 2: closed shapes that miss themselves, with marker fills that miss the line.
  const egg = ellipse(270, 640, 150, 190), duck = curve([[640, 560], [760, 470], [880, 520], [900, 640], [990, 690], [930, 760], [760, 800], [650, 730]], { closed: true });
  tint(g, egg, SPOT.sand, { key: 'egg', t });
  tint(g, duck, SPOT.yellow, { key: 'duck', t });
  outline(g, egg, { key: 'egg', t, w: 5 });
  outline(g, duck, { key: 'duck', t, w: 5 });
  ink(g, curve([[915, 655], [985, 640], [1010, 668], [940, 690]]), { key: 'bill', t, w: 4 });
  tint(g, curve([[915, 655], [985, 640], [1010, 668], [940, 690]], { closed: true }), SPOT.orange, { key: 'billf', t, marker: false });
  g.fillStyle = INK; g.beginPath(); g.arc(860, 600, 9, 0, TAU); g.fill();
  // Row 3: hatching, cross-hatching with a fade, scribble.
  const box = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  hatch(g, ellipse(200, 1070, 140, 120), { key: 'h1', t });
  hatch(g, box(400, 960, 260, 230), { key: 'h2', t, cross: true, fade: (u) => 1 - u });
  scribble(g, ellipse(860, 1070, 120, 110), { key: 's1', t });
  // Row 4: action marks on a bouncing ball, timed.
  const u = (t % 1), y = 1520 - Math.abs(Math.sin(u * Math.PI)) * 220, squash = y > 1500 ? .8 : 1;
  tint(g, ellipse(300, y, 60 / squash, 60 * squash), SPOT.red, { key: 'ball', t });
  outline(g, ellipse(300, y, 60 / squash, 60 * squash), { key: 'ball', t, w: 4.5 });
  if (y > 1500) burst(g, 300, 1585, { key: 'hit', t, r0: 70, r1: 110, a0: Math.PI * 1.05, span: Math.PI * .9 });
  else speed(g, 300, y + 70, 0, 1, { key: 'sp', t, n: 3, len: 50 });
  puff(g, 760, 1500, 70, { key: 'dust', t, u: (t * .5) % 1, fill: SPOT.sky });
  ink(g, [[60, 1600], [1020, 1600]], { key: 'ground', t, w: 3.5, wobble: 2, skip: .4 });
}
const SHOTS=[]; // {id,start,end,readAt,action,transition}, derived from the work's one timeline
// ART END

// SCORE BEGIN: place sounds with the sound kit at the same event times the picture uses.
function buildScore(s) {
  for (let k = 0; k < 4; k++) { contact(s, k + .5, { material: 'wood', f0: 320, level: .2, key: 'b' + k }); pluck(s, k + .5, note('E5'), { level: .08, key: 'p' + k }); }
}
const MARKS=[.5,1.5,2.5,3.5]; // visible event times the score lands on, read by audio.mjs
// SCORE END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=W;canvas.height=H;
const paperCanvas=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time'),playBtn=document.getElementById('play'),soundBtn=document.getElementById('sound');
function render(t){
  t=clamp(t,0,DUR);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paperCanvas,0,0);drawArt(t);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  scrub.value=t;clockLabel.value=t.toFixed(2);
}
/* The score renders once, offline and seeded, and is shared by the player and renderAudio(). */
let scorePromise=null;
function score(){
  if(!scorePromise)scorePromise=(async()=>{const s=Score({duration:DUR,key:TITLE});buildScore(s);const b=await s.render({target:-16,ceiling:-1});window.__scoreStats=s.stats;return b;})();
  return scorePromise;
}
async function renderAudio(){return wavBase64(await score());}
/* Play runs on the score's clock when sound is on, so picture and sound stay together. A frame
   slower than the frame interval cannot play live: Play then draws every frame once into a cache,
   shown as "Buffering n%", and plays from it. seek() and window.__film stay live and pure. */
const NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map();
let at=0,playing=false,starting=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0,sound=true,actx=null,src=null;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';soundBtn.textContent=sound?'Sound on':'Sound off';}
function clock(){return src?actx.currentTime-epoch:(performance.now()-epoch)/1000;}
function stopSound(){if(src){try{src.stop();}catch(e){}src=null;}}
async function start(){
  if(at>=DUR)at=0;playing=true;starting=true;label();
  if(sound){
    try{const b=await score();actx=actx||new AudioContext();await actx.resume();
      if(!playing){starting=false;return;}
      src=actx.createBufferSource();src.buffer=b;src.connect(actx.destination);epoch=actx.currentTime-at;src.start(0,at);starting=false;return;
    }catch(e){console.warn('score did not play',e);}
  }
  epoch=performance.now()-at*1000;starting=false;
}
function pause(){if(playing&&!starting)at=clamp(clock(),0,DUR);playing=false;starting=false;buffering=false;stopSound();label();if(recorder&&recorder.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.85);
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  if(!slow||filled>=NF+1)start();else buffer();
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
soundBtn.onclick=()=>{const was=playing;if(was)pause();sound=!sound;label();if(was)play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);if(e.code==='KeyM')soundBtn.onclick();});
document.getElementById('record').onclick=()=>{
  if(recorder&&recorder.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const d=document.getElementById('download');d.href=recordURL;d.download='preview.webm';d.style.display='inline';};
  recorder.start();play();
};
function frameLoop(){
  if(playing&&!starting){
    at=clamp(clock(),0,DUR);
    if(!slow)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(frameLoop);
}
window.__film={duration:DUR,ready:false,seek,renderAudio,shots:SHOTS,marks:MARKS};
seek(Number(new URLSearchParams(location.search).get('t'))||0);
requestAnimationFrame(frameLoop);
window.__film.ready=true;
</script></html>
